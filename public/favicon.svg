<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="finanflyBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0055ff" />
      <stop offset="100%" stop-color="#0026b3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Rounded Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#finanflyBlueGrad)" />

  <!-- Speed Lines -->
  <rect x="70" y="215" width="110" height="18" rx="9" fill="#4d88ff" opacity="0.8" />
  <rect x="40" y="255" width="140" height="18" rx="9" fill="#3377ff" opacity="0.65" />
  <rect x="70" y="295" width="100" height="18" rx="9" fill="#4d88ff" opacity="0.8" />

  <!-- Dynamic Forward-Slanted Letter F -->
  <!-- Slanted Polygon representing modern bold F -->
  <path d="M 215 105 L 395 105 L 380 170 L 290 170 L 275 230 L 360 230 L 345 290 L 260 290 L 225 415 L 145 415 Z" 
        fill="#ffffff" 
        filter="url(#shadow)" />

  <!-- Flying Dollar Banknote with Angel Wings -->
  <g transform="translate(180, 280) rotate(-12)" filter="url(#shadow)">
    <!-- Left Wing -->
    <path d="M 0 35 C -35 20 -55 -5 -35 -20 C -25 -10 -20 10 -5 15 C -25 -5 -10 -25 5 -15 C 10 5 10 20 15 30 Z" 
          fill="#ffffff" stroke="#0033cc" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Right Wing -->
    <path d="M 140 30 C 175 15 195 -10 175 -25 C 165 -15 160 5 145 10 C 165 -10 150 -30 135 -20 C 130 0 130 15 125 25 Z" 
          fill="#ffffff" stroke="#0033cc" stroke-width="4" stroke-linejoin="round" />

    <!-- Banknote Body -->
    <rect x="0" y="0" width="140" height="75" rx="8" ry="8" fill="#ffffff" stroke="#0033cc" stroke-width="7" />
    <!-- Banknote inner frame -->
    <rect x="8" y="8" width="124" height="59" rx="4" ry="4" fill="none" stroke="#0033cc" stroke-width="3" stroke-dasharray="6 3" />
    <!-- Dollar Circle -->
    <circle cx="70" cy="37.5" r="20" fill="#0033cc" />
    <text x="70" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
    <!-- Side dots -->
    <circle cx="28" cy="37.5" r="4.5" fill="#0033cc" />
    <circle cx="112" cy="37.5" r="4.5" fill="#0033cc" />
  </g>
</svg>
