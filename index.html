<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5" />
    <link rel="shortcut icon" href="/favicon.ico?v=5" />
    <link rel="alternate icon" type="image/x-icon" href="/favo.ico?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <link rel="manifest" href="/manifest.json?v=5" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinanFly" />
    <meta name="description" content="Aplicativo de Controle Financeiro completo com painel administrativo, controle de receitas, despesas, planejamento anual e resumo mensal/anual." />
    <meta property="og:title" content="FinanFly - Controle Financeiro Inteligente" />
    <meta property="og:description" content="Aplicativo de Controle Financeiro completo com painel administrativo, controle de receitas, despesas, planejamento anual e resumo mensal/anual." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>FinanFly - Controle Financeiro Inteligente</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Capture PWA install prompt globally
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('finanfly-install-ready', { detail: e }));
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
