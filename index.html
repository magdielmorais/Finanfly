<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5" />
    <link rel="shortcut icon" href="/favicon.ico?v=5" />
    <link rel="alternate icon" type="image/x-icon" href="/favo.ico?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <link rel="manifest" href="/manifest.json?v=5" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinanFly" />
    <title>FinanFly - Controle Financeiro Inteligente</title>
  </head>
  <body>
    <div id="root">
      <div id="app-splash-loader" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #090d16; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; z-index: 99999; -webkit-user-select: none; user-select: none;">
        <!-- Logo quadrada com cantos arredondados (squircle ~22%) -->
        <div style="width: 104px; height: 104px; border-radius: 24px; overflow: hidden; box-shadow: 0 16px 36px -8px rgba(7, 95, 252, 0.45); display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #075ffc, #0022a3);">
          <img src="/favicon.svg?v=5" alt="FinanFly" style="width: 100%; height: 100%; object-fit: cover; border-radius: 24px; display: block;" />
        </div>
        
        <h1 style="margin: 20px 0 0; font-size: 22px; font-weight: 800; color: #ffffff; letter-spacing: -0.02em;">
          FinanFly
        </h1>
        <p style="margin: 6px 0 0; font-size: 13px; font-weight: 700; color: #60a5fa; letter-spacing: 0.02em;">
          Suas finanças voando!
        </p>

        <div style="margin-top: 28px; display: flex; align-items: center; gap: 8px;">
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; animation: splashPulse 1.2s infinite ease-in-out both;"></div>
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; animation: splashPulse 1.2s infinite ease-in-out both; animation-delay: 0.2s;"></div>
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; animation: splashPulse 1.2s infinite ease-in-out both; animation-delay: 0.4s;"></div>
        </div>
        <p style="margin-top: 12px; font-size: 11px; font-weight: 600; color: #64748b; letter-spacing: 0.05em; text-transform: uppercase;">
          Carregando...
        </p>
      </div>
      <style>
        @keyframes splashPulse {
          0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
          40% { transform: scale(1.1); opacity: 1; }
        }
      </style>
    </div>
    <script>
      // Capture PWA install prompt globally
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('finanfly-install-ready', { detail: e }));
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
